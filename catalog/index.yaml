# Catalog — Godot Game UI Library 索引
# AI 检索入口：按 名称/分类/类型/交互/效果/tags 搜索后，打开 Scene → 看 Inspector 参数 → 拖入组合。
# 新增 Block 必须在此登记（见 .ai/contribution_rules.md）。

version: 0.2
engine: godot 4.7
lang: gdscript

# block_type: pure = 无脚本（Godot 原生节点 + Theme）；behavior = 原生节点 + 最小脚本（Theme 做不了的行为）
blocks:

  - id: button
    name: Button
    block_type: pure
    category: button
    scene: res://blocks/button/Button.tscn
    demo: res://demos/button/ButtonDemo.tscn
    script: none
    interactions: [hover, press]
    effects: []
    tags: [button, pure, game-ui]

  - id: scale_button
    name: Scale Button
    block_type: behavior
    category: button
    scene: res://blocks/button/ScaleButton.tscn
    demo: res://demos/button/ButtonDemo.tscn
    script: res://blocks/button/scale_button.gd
    interactions: [hover, press, release]
    effects: [scale]
    parameters:
      hover_scale: "Vector2(1.05, 1.05)"
      press_scale: "Vector2(0.92, 0.92)"
      duration: 0.12
      transition: TRANS_BACK
      ease: EASE_OUT
    tags: [button, behavior, scale, feedback, game-ui]

  - id: toggle_button
    name: Toggle Button
    block_type: pure
    category: button
    scene: res://blocks/button/ToggleButton.tscn
    demo: res://demos/button/ButtonDemo.tscn
    script: none
    interactions: [select, deselect]
    effects: []
    notes: 原生 toggle_mode；选中视觉 = Theme 的 pressed StyleBox
    tags: [button, toggle, pure, game-ui]

  - id: panel
    name: Panel
    block_type: pure
    category: panel
    scene: res://blocks/panel/Panel.tscn
    demo: res://demos/panel/PanelDemo.tscn
    script: none
    interactions: []
    effects: []
    tags: [panel, container, pure, game-ui]

  - id: popup_panel
    name: Popup Panel
    block_type: behavior
    category: panel
    scene: res://blocks/popup/PopupPanel.tscn
    demo: res://demos/panel/PanelDemo.tscn
    script: res://blocks/popup/ui_popup.gd
    interactions: [open, close]
    effects: [fade, scale]
    parameters:
      animation_mode: "FADE | SCALE | NONE"
      duration: 0.2
      modal: false
      close_on_click_outside: true
    tags: [panel, popup, modal, fade, scale, behavior, game-ui]

  - id: card
    name: Card
    block_type: behavior
    category: card
    scene: res://blocks/card/Card.tscn
    demo: res://demos/card/CardDemo.tscn
    script: res://blocks/card/card.gd
    interactions: [hover, select, deselect]
    effects: [scale]
    parameters:
      selectable: true
      disabled: false
      hover_scale: "Vector2(1.0, 1.0)"
      selected_scale: "Vector2(1.0, 1.0)"
      duration: 0.12
    notes: 状态视觉 = Theme 变体 Card/CardHover/CardSelected/CardDisabled
    tags: [card, select, hover, behavior, game-ui]

  - id: drawer_panel
    name: Drawer Panel
    block_type: behavior
    category: panel
    scene: res://blocks/drawer/DrawerPanel.tscn
    demo: res://demos/drawer/DrawerDemo.tscn
    script: res://blocks/drawer/drawer_panel.gd
    interactions: [open, close]
    effects: [slide]
    parameters:
      direction: "LEFT | RIGHT | TOP | BOTTOM"
      duration: 0.25
      transition: TRANS_CUBIC
      modal: true
      close_on_click_outside: true
    tags: [drawer, sidebar, slide, modal, behavior, game-ui]

  - id: slide_out_panel
    name: Slide Out Panel
    block_type: behavior
    category: panel
    scene: res://blocks/drawer/SlideOutPanel.tscn
    demo: res://demos/SlideOutBuildingDemo.tscn
    script: res://blocks/drawer/slide_out_panel.gd
    interactions: [open, close]
    effects: [slide]
    parameters:
      direction: "LEFT | RIGHT | TOP | BOTTOM"
      duration: 0.25
      transition: TRANS_CUBIC
      ease: EASE_OUT
      collapsed_visible_size: 48.0
      start_open: false
    purpose: 从屏幕边缘滑入/滑出的可折叠面板；ToggleButton 与 Panel 同一整体移动，收起时保留 collapsed_visible_size 区域（手柄）可见
    notes: 锚点贴边方案天然抗 Resize；Content 完全可替换（建筑菜单/背包/列表/商店）
    tags: [drawer, slide, collapsible, toggle, behavior, game-ui]

interactions:
  - id: hover
    name: Hover
    description: 鼠标进入/离开（Theme hover StyleBox / 脚本缩放）
  - id: press
    name: Press
    description: 按下（Theme pressed StyleBox / 脚本缩放）
  - id: select
    name: Select
    description: 选中/取消（toggle_mode 或 theme_type_variation 切换）
  - id: open
    name: Open
    description: 打开（显示 + 入场动画）
  - id: close
    name: Close
    description: 关闭（退场动画 + 隐藏）

effects:
  - id: scale
    name: Scale
    description: 缩放反馈（Transform 变化，Theme 做不了，脚本负责）
  - id: fade
    name: Fade
    description: 透明度渐入渐出
  - id: slide
    name: Slide
    description: 位置滑入滑出（Drawer）
